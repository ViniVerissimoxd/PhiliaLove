<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Memórias</title>

  <link rel="stylesheet"
        href="./css/style.css">

</head>

<body>

  <div id="startScreen">

  <h1>
    Reviva as memórias de cada imagem
    para libertar a memória final das correntes. ❤️🔑
  </h1>

  <button id="enterButton">

    Entrar

  </button>

  </div>

  <div class="timeline">

    <a href="./Game.html?heart=1"
       class="photo"
       id="photo1">

      <img src="./img/photo1.jpg">

    </a>

    <a href="./Game.html?heart=2"
       class="photo"
       id="photo2">

      <img src="./img/photo2.jpg">

    </a>

    <a href="./Game.html?heart=3"
       class="photo"
       id="photo3">

      <img src="./img/photo3.jpg">

    </a>

    <div class="final-section">

      <div class="locked-container">

        <img src="./img/photo4.jpg"
             class="final-photo"
             id="finalPhoto">

        <img src="./img/file_00000000779c720e90502199647f9d60.png"
             id="chains">

      </div>

      <div class="hearts">

        <span id="c1">🤍</span>
        <span id="c2">🤍</span>
        <span id="c3">🤍</span>

      </div>

    </div>

  </div>

  <audio id="bgMusic" loop>

    <source
      src="./music/menu-song.mp3"
      type="audio/mpeg">

  </audio>

  <script src="./js/script.js"></script>

</body>
</html>
